<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Evaluación de Avisos de Adopción</title>
    
    
    <!------------------------------------------------------------------->

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <style>
        table, th, td{
            border:1px solid black;
        }

        .evaluar{
            color: #0056b3;
            cursor: pointer;
        }

        .not{
            display: flex;
            justify-content: center
        }

        .nota-btn.active {
            background-color: #007bff;
            color: white;
            border-color: #007bff;
        }

    </style>


</head>
<body>


    <div>
        <div>
            <h1>Evaluación de Avisos de Adopción</h1>
        </div>



        <!------------------------------------------------------------------->
        
        <div th:if="${avisos.empty}">
            <h4>No hay avisos de adopción para mostrar</h4>
            <p>No se encontraron avisos en la base de datos.</p>
        </div>



        <!------------------------------------------------------------------->



        <div th:unless="${avisos.empty}">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Fecha publicación</th>
                        <th>Sector</th>
                        <th>Cantidad Tipo Edad</th>
                        <th>Comuna</th>
                        <th>nota</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="aviso : ${avisos}">
                        <td th:text="${aviso.id}"></td>

                        <td th:text="${#temporals.format(aviso.fechaIngreso, 'dd/MM/yyyy HH:mm')}"></td>

                        <td th:text="${aviso.sector}"></td>
                        <td>
                            <p th:text="${aviso.Cantidad} +' '+ ${aviso.Tipo}"></p>
                            <p th:text="${aviso.Edad} +'  '+ ${aviso.unidadMedida.equals('a')? 'años' : 'meses'}"></p>
                        </td>
                        <td th:text="${aviso.comuna?.nombre}"></td>
                        <td>
                            <span class="not"
                                  th:id="'promedio-' + ${aviso.id}" 
                                  th:text="${aviso.promedioNotas.equals(0.0)? '-' : #numbers.formatDecimal(aviso.promedioNotas, 1, 1)}">
                            </span>
                        </td>
                        <td>
                            <a class ="evaluar"
                               th:onclick="'evaluarAviso(' + ${aviso.id} + ')'"
                               title="Evaluar este aviso">
                               evaluar
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>


    <!------------------------------------------------------------------->


    <div class="modal fade" id="modalEvaluar" tabindex="-1">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div>
                    <h5>Evaluar Aviso</h5>
                    <button type="button" data-bs-dismiss="modal">Cerrar</button>
                </div>
                <div>
                    <p>Seleccione una nota:</p>
                    <div>
                        <button th:each="i : ${#numbers.sequence(1,7)}" 
                                type="button"
                                class="btn btn-outline-primary nota-btn"
                                th:onclick="'seleccionarNota(' + ${i} + ')'"
                                th:text="${i}">
                        </button>
                    </div>

                </div>
                <div>
                    <button type="button" class="btn-primary" onclick="confirmarEvaluacion()">
                        Confirmar Evaluación
                    </button>
                </div>
            </div>
        </div>
    </div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    

    <script src="/js/app.js"></script>
</body>
</html>
