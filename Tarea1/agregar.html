<!DOCTYPE html>
<html>
<head>

    <title>Agregar Aviso Adopción</title>

</head>
    <body>

        <div id="val-box" hidden>
            <h2 id="val-msg"></h2>
            <ul id="val-list"></ul>
        </div>


        <h1>Agregar Aviso Adopción</h1>
        <div>
            <form name="formulario" method="post" enctype="multipart/form-data">
                <h3>Lugar</h3>

                <label>Región</label>
                <select name="Región" id="Región">
                    <option value="">Seleccione una Región</option>
                </select><br>
                

                <label>Comuna</label>
                <select name="Comuna" id="Comuna">
                    <option value="">Seleccione una Comuna</option>
                </select><br>
                

                <label>Sector</label>
                <input type="text" name="Sector" id="Sector"><br>
                




                <h3>Contacto</h3>

                <label>Nombre</label>
                <input type="text" name="Nombre" id="Nombre" minlength="3"><br>

                <label>Email</label>
                <input type="email" name="Email" id="Email"><br>

                <label>Teléfono</label>
                <input type="tel" name="Teléfono" id="Teléfono" minlength="0" maxlength="999999999"><br>

                <label>Contactar por</label>
                <select name="Contacto" id="Contacto">
                    <option value="">Seleccione Medio de Contacto</option>
                </select><br>

                <label>Id o URL</label>
                <input type="text" name="Id" id="Id"><br>

                



                <h3>Mascota</h3>

                <label>Tipo de Animal</label>
                <select name="Tipo" id="Tipo">
                    <option value="">Seleccione un Tipo</option>
                </select><br>

                <label>Edad</label>
                <input type="number" name="Edad" id="Edad" min="1" max="99"><br>

                <label>Unidad Edad</label>
                <select name="Unidad" id="Unidad">
                    <option value="">Seleccione una Unidad</option>
                </select><br>    
                
                <label>Fecha Entrega</label>
                <input type="date" name="Fecha" id="Fecha"><br>

                <label>Descripción</label>
                <input type="text" name="Descripción" id="Descripción" minlength="0" maxlength="200"><br>


                <label>Fotos</label>
                <input type="file" name="Foto" id="Foto" multiple accept="image/*,.pdf"><br>
                <div>
                    <button id="sumbit-btn" type="button">Agregar Este Aviso</button>
                </div>

                

            </form>
        </div>
        <script src="validación.js"></script>
        <script src="select.js"></script>
    </body>
</html>
